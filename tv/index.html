<!doctype html>
<html lang="en" data-theme="retro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' ws: wss: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Retro Darts: TV scoreboard</title>
<style>
/* The TV scoreboard a Chromecast opens when the scorer taps Cast to TV. It only draws what the scorer sends. */
@font-face{font-family:"Barlow Condensed";src:url(/fonts/barlow-condensed-400-700.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(/fonts/barlow-condensed-800-900.woff2) format("woff2");font-weight:800 900;font-display:swap}
@font-face{font-family:DSEG7Classic;src:url(/fonts/dseg7-classic-italic.woff2) format("woff2");font-style:italic;font-display:block}
:root{--bg:#F5CF14;--ink:#111;--panel:#0A0A0A;--panel-ink:#F5CF14;--led:#FF2B1C;--accent:#D0130A;--accent-ink:#fff;--line:#0A0A0A}
[data-theme="led"]{--bg:#0A0A0A;--ink:#F2F2F2;--panel:#141416;--panel-ink:#F2F2F2;--led:#FF3B2F;--accent:#D8281E;--accent-ink:#fff;--line:#3a3a3e}
[data-theme="modern"]{--bg:#0B0F17;--ink:#F2F5F9;--panel:#151B27;--panel-ink:#F2F5F9;--led:#fff;--accent:#3DDC84;--accent-ink:#06130c;--line:#2a3344}
[data-theme="pub-oche"]{--bg:#1C1D18;--ink:#F3EBDD;--panel:#11120E;--panel-ink:#F3EBDD;--led:#FF3B2F;--accent:#D3AD6A;--accent-ink:#1b1608;--line:#5b553f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase}
/* 3% keeps everything clear of the edge some TVs crop */
.tv{position:fixed;inset:3vh 3vw;display:grid;grid-template-rows:auto 1fr;gap:2.5vh}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2vw;font-weight:800;font-size:3.4vh;letter-spacing:.08em}
.top .pos{text-align:right}
.games{display:flex;align-items:center;gap:1.2vw;padding:.6vh 1.6vw;background:var(--panel);color:var(--led);font:italic 400 6.5vh/1 DSEG7Classic,monospace}
.games small{font:800 2.2vh/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;color:var(--panel-ink);opacity:.8}
.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.5vw;min-height:0}
.card{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:1.5vh;min-width:0;min-height:0;padding:2vh 2vw;background:var(--panel);color:var(--panel-ink);border:.8vh solid var(--line)}
.card.on{border-color:var(--accent)}
.turn{display:inline-block;margin-bottom:1vh;padding:.5vh 1.2vw;font-weight:800;font-size:2.8vh;letter-spacing:.14em;opacity:.85}
.card.on .turn{background:var(--accent);color:var(--accent-ink);opacity:1}
.name{font-weight:800;font-size:6.2vh;line-height:1.05;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.left{align-self:center;justify-self:center;color:var(--led);font:italic 400 min(30vh,13vw)/1 DSEG7Classic,monospace}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2vw}
.stat{display:grid;gap:.4vh;font-weight:800;font-size:2.4vh;letter-spacing:.14em}
.stat b{color:var(--led);font:italic 400 min(5.5vh,3vw)/1 DSEG7Classic,monospace;white-space:nowrap}
.banner,.idle{position:fixed;inset:0;display:grid;place-content:center;gap:2vh;text-align:center;padding:6vw}
.banner{background:rgba(0,0,0,.82);color:#fff;font-weight:900;font-size:11vh;line-height:1.05}
.idle{background:var(--bg);font-weight:900;font-size:9vh;line-height:1.05}
.idle small{font-weight:600;font-size:3.6vh;text-transform:none;letter-spacing:.01em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="tv" id="board" hidden>
  <div class="top"><span id="format"></span><span class="games"><small>Games</small><span id="games"></span></span><span class="pos" id="pos"></span></div>
  <div class="cards">
    <section class="card" id="c0"><div><div class="turn" id="turn0"></div><div class="name" id="name0"></div></div><div class="left" id="left0"></div><div class="stats"><div class="stat">Last<b id="last0"></b></div><div class="stat">Legs<b id="legs0"></b></div><div class="stat">Avg<b id="avg0"></b></div></div></section>
    <section class="card" id="c1"><div><div class="turn" id="turn1"></div><div class="name" id="name1"></div></div><div class="left" id="left1"></div><div class="stats"><div class="stat">Last<b id="last1"></b></div><div class="stat">Legs<b id="legs1"></b></div><div class="stat">Avg<b id="avg1"></b></div></div></section>
  </div>
</main>
<div class="banner" id="banner" hidden></div>
<div class="idle" id="idle">Retro Darts<small id="idle-note">Waiting for the scorer. Start a match on the tablet.</small></div>
<script src="tv.js"></script>
</body>
</html>
