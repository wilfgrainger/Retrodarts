name: Bug report
description: Tell us about something that is not working.
body:
  - type: markdown
    attributes:
      value: "Use invented names and remove private data from screenshots. Do not disclose vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: e.g. iPad, Safari
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: App revision or date last updated (if known)
  - type: dropdown
    id: connection
    attributes:
      label: How were you using it?
      options:
        - Browser online
        - Browser offline
        - Home-screen app
        - Standalone HTML file
